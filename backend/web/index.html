<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>瓦房店推倒胡 · 本地联机</title><style>
*{box-sizing:border-box}body{margin:0;background:#edf3ef;color:#163e31;font:16px system-ui}main{max-width:850px;margin:auto;padding:20px}button,input{font:inherit;padding:12px;border-radius:8px;border:1px solid #90b4a4;margin:4px}button{background:#14634c;color:white;cursor:pointer}button:disabled{opacity:.5;cursor:default}input{max-width:100%;background:white}#error{color:#a22424;min-height:26px}#players{display:grid;grid-template-columns:1fr 1fr;gap:8px}.player{background:#fff;border:2px solid transparent;border-radius:12px;padding:12px;overflow-wrap:anywhere}.active{border-color:#176b50}.tiles{display:flex;flex-wrap:wrap;gap:2px;min-height:24px}.tiles img{width:28px;height:40px;object-fit:contain}#hand{display:flex;gap:2px;flex-wrap:wrap;margin:22px 0}#hand button{border:0;background:none;margin:0;padding:0;width:calc(100% / 14 - 2px);min-width:22px}#hand img{width:100%;display:block}#hand button:hover{transform:translateY(-6px)}#bill{white-space:pre-wrap;padding:14px;background:#fff;border-radius:12px}small{color:#547567}#status{padding:14px;background:#10573f;color:white;border-radius:12px}a{color:#125d48}.back{display:inline-block;width:12px;height:20px;background:#236e51;margin:1px;border:1px solid #b9d3c7}
</style><main><h1>瓦房店推倒胡</h1><p><a href="/?seat=A" target="_blank">窗口 A</a> · <a href="/?seat=B" target="_blank">窗口 B</a> · <a href="/?seat=C" target="_blank">窗口 C</a> · <a href="/?seat=D" target="_blank">窗口 D</a></p><small>先用 A 创建房间，B/C/D 输入相同房号加入。四人准备后开始。测试页点击手牌直接出牌。</small><section id="lobby"><p><label>昵称 <input id="name" maxlength="16"></label></p><button id="create">创建房间</button><label>房间号 <input id="code" maxlength="6" inputmode="numeric"></label><button id="join">加入房间</button></section><p id="error" role="alert"></p><section id="game" hidden><p id="status"></p><button id="ready">准备 / 下一局</button><button id="reconnect">重新连接</button><button id="dissolve">申请 / 同意解散</button><button id="cancel">拒绝解散</button><button id="forget">返回首页</button><p id="votes"></p><div id="players"></div><p>你的手牌（仅自己可见）</p><div id="hand"></div><div id="actions"></div><pre id="bill"></pre></section></main><script src="/app.js"></script></html>
